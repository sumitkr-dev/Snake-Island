<!DOCTYPE html>
<html>
<head>
<title>Text Formatting</title>
<style>
body{ background-color: lightblue; }
p{ color:blue; font-family:Arial Black; text-align:center; font-weight:bolder; text-decoration:underline; font-size:14pt;}
pre{ font-style:italic; text-align:center; text-transform:capitalize; font-family:Arial; white-space:pre-wrap;}
</style>
</head>
<body>
<p>Snake island: The Deadliest Island on Earth</p>
<pre>Snake island, or Ilha da Queimada Grande, is a small, isolated island off the coast of Brazil, famous for its dense population of venomous snakes. The island is home to the golden lancehead pit viper, a species found nowhere else.</pre>
</body>
</html>
